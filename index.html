<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="description" content="ItsLoong 的插画与壁纸收藏。按卷浏览作品，预览或获取原图。">
  <title>ItsLoong 画集 · Image Archive</title>
  <link rel="icon" href="/gallery/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/gallery/archive.css">
  <script defer src="/gallery/archive.js"></script>
</head>
<body>
  <header class="topbar wrap">
    <a class="brand" href="/" aria-label="ItsLoong 画集首页"><img src="/gallery/mark.svg" alt="" width="29" height="29">ItsLoong<span>画集</span></a>
    <nav aria-label="主导航"><a href="#collection">馆藏</a><a href="https://github.com/ItsLoong/picgo-images" aria-label="GitHub 仓库"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.77-.24.77-.54v-2.12c-3.13.68-3.8-1.33-3.8-1.33-.51-1.3-1.25-1.64-1.25-1.64-1.02-.7.08-.68.08-.68 1.13.08 1.72 1.16 1.72 1.16 1 .1.77 2.07 3.29 1.33.1-.73.39-1.24.71-1.52-2.5-.28-5.12-1.25-5.12-5.55 0-1.23.44-2.24 1.16-3.03-.12-.28-.5-1.44.11-3 0 0 .95-.3 3.1 1.16a10.8 10.8 0 0 1 5.65 0c2.14-1.45 3.08-1.16 3.08-1.16.62 1.56.23 2.72.12 3 .72.79 1.16 1.8 1.16 3.03 0 4.31-2.62 5.26-5.13 5.54.4.35.75 1.03.75 2.08v3.08c0 .31.2.65.78.54A11.2 11.2 0 0 0 12 .8Z"/></svg></a></nav>
  </header>
  <main class="wrap">
    <section class="feature" id="feature" aria-label="精选作品">
      <img id="coverArt" src="/wallpapers/desktop/anime/vol-459-10.webp" alt="深蓝天幕下的水上旅途" fetchpriority="high">
      <div class="feature-top"><span class="edition">本期选映</span><span class="mono" id="coverNumber">VOL. 459 / 10</span></div>
      <div class="feature-bottom">
        <div><h1 id="coverTitle">云海之间</h1><a id="coverLink" href="/wallpapers/desktop/anime/vol-459-10.webp" target="_blank" rel="noopener">查看原图 <span aria-hidden="true">↗</span></a></div>
        <div class="cover-controls" id="coverControls" role="group" aria-label="切换精选作品"></div>
      </div>
    </section>
    <section id="collection" aria-labelledby="collectionTitle">
      <div class="collection-header"><h2 id="collectionTitle">作品馆藏 <sup id="totalCount"></sup></h2>
        <label class="searchfield"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg><input id="search" type="search" aria-label="搜索作品" placeholder="搜索作品、卷号或标签"></label>
      </div>
      <div class="toolbar"><div class="tabs" role="group" aria-label="图片类型">
        <button data-type="all" aria-pressed="true">全部</button><button data-type="wallpaper" aria-pressed="false">壁纸</button><button data-type="avatar" aria-pressed="false">头像</button></div>
        <details><summary>筛选与排序</summary><div class="filters">            <select class="control" id="scene" aria-label="场景"><option value="all">所有场景</option></select>
            <select class="control" id="device" aria-label="设备"><option value="all">所有设备</option><option value="desktop">桌面</option><option value="mobile">手机</option></select>
            <select class="control" id="orientation" aria-label="方向"><option value="all">所有方向</option><option value="landscape">横向</option><option value="portrait">竖向</option><option value="square">方形</option></select>
            <select class="control" id="sort" aria-label="排序"><option value="recent">按卷号倒序</option><option value="name">按名称排序</option><option value="pixels">按分辨率排序</option><option value="bytes">按文件大小排序</option><option value="random">随机排序</option></select></div></details>
      </div>
      <div id="resultCount" aria-live="polite"></div>
      <div class="gallery" id="gallery"><div class="empty">正在加载馆藏…</div></div>
      <button id="loadmore" class="loadmore" hidden>加载更多图片</button>
    </section>
  </main>
  <footer class="wrap"><span>ItsLoong 画集</span><span>图片版权归原作者所有</span></footer>
  <dialog id="preview" aria-label="图片详情">
    <div class="modalhead"><strong id="previewName">图片详情</strong><button type="button" class="iconbutton" id="closePreview" aria-label="关闭预览">×</button></div>
    <div class="modalcontent">
      <div class="fullimage">
        <img id="previewImage" alt="">
        <div class="overlaycontrols">
          <button class="iconbutton" type="button" id="prev" aria-label="上一张">←</button>
          <button class="iconbutton" type="button" id="next" aria-label="下一张">→</button>
        </div>
      </div>
      <aside class="modalaside">
        <div><div class="asidekey">文件路径</div><div class="asidevalue" id="previewPath"></div></div>
        <div><div class="asidekey">图片尺寸</div><div class="asidevalue" id="previewDimensions"></div></div>
        <div><div class="asidekey">文件信息</div><div class="asidevalue" id="previewFormat"></div></div>
        <div><div class="asidekey">分类</div><div class="asidevalue" id="previewCategory"></div></div>
        <div><div class="asidekey">标签</div><div class="taglist" id="previewTags"></div></div>
        <div class="asidebottom">
          <a id="openOriginal" class="action primary" href="#" target="_blank" rel="noopener noreferrer">新窗口查看原图 ↗</a>
          <button type="button" class="action" id="copyLink">复制图片链接</button>
          <div class="muted" id="previewPosition">使用 ← → 方向键切换图片</div>
        </div>
      </aside>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
