name: Update Image Index

on:
  push:
    branches: [main]
    paths:
      - "wallpapers/**"
      - "avatars/**"
      - "_image_meta.json"
      - "scripts/build_image_index.py"
      - "scripts/requirements.txt"
      - ".github/workflows/update-image-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: image-index-main
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/build_image_index.py --owner ItsLoong --repo picgo-images --branch main
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images-index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update image index"
            git push
          fi
